<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cosmic Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
  #info {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.5); font: 14px monospace; text-align: center;
    pointer-events: none; user-select: none;
  }
  #title {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.15); font: bold 28px monospace; letter-spacing: 8px;
    pointer-events: none; user-select: none; text-transform: uppercase;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Cosmic Garden</div>
<div id="info">click to plant stars &middot; hold to grow nebulae &middot; scroll to shift spectrum</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

// --- Palette ---
let hueShift = 0;
function starColor(seed, alpha = 1) {
  const h = (seed * 137.508 + hueShift) % 360;
  const s = 60 + seed % 40;
  const l = 55 + (seed * 7) % 30;
  return `hsla(${h},${s}%,${l}%,${alpha})`;
}

// --- Particles ---
const particles = [];
const MAX_PARTICLES = 4000;

class Particle {
  constructor(x, y, type = 'star') {
    this.x = x;
    this.y = y;
    this.type = type;
    this.seed = Math.random() * 100;
    this.vx = (Math.random() - 0.5) * (type === 'nebula' ? 0.3 : 1.5);
    this.vy = (Math.random() - 0.5) * (type === 'nebula' ? 0.3 : 1.5);
    this.life = 1;
    this.maxLife = type === 'nebula' ? 600 + Math.random() * 400 : 300 + Math.random() * 500;
    this.age = 0;
    this.radius = type === 'nebula' ? 2 + Math.random() * 4 : 0.5 + Math.random() * 2;
    this.twinkleSpeed = 0.02 + Math.random() * 0.05;
    this.twinklePhase = Math.random() * Math.PI * 2;
    this.orbitRadius = Math.random() * 30 + 10;
    this.orbitSpeed = (Math.random() - 0.5) * 0.01;
    this.orbitAngle = Math.random() * Math.PI * 2;
    this.originX = x;
    this.originY = y;
    this.connections = [];
  }

  update(mouse) {
    this.age++;
    const lifeRatio = this.age / this.maxLife;
    this.life = lifeRatio < 0.1 ? lifeRatio / 0.1
              : lifeRatio > 0.7 ? 1 - (lifeRatio - 0.7) / 0.3
              : 1;

    if (this.type === 'star') {
      this.orbitAngle += this.orbitSpeed;
      this.x = this.originX + Math.cos(this.orbitAngle) * this.orbitRadius * 0.3;
      this.y = this.originY + Math.sin(this.orbitAngle) * this.orbitRadius * 0.3;
      this.originX += this.vx * 0.1;
      this.originY += this.vy * 0.1;
    } else {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.998;
      this.vy *= 0.998;
    }

    // Gravity toward mouse
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 1;
      const force = Math.min(50 / dist, 0.5);
      this.vx += (dx / dist) * force * 0.1;
      this.vy += (dy / dist) * force * 0.1;
      if (this.type === 'star') {
        this.originX += (dx / dist) * force * 0.05;
        this.originY += (dy / dist) * force * 0.05;
      }
    }

    return this.age < this.maxLife;
  }

  draw(ctx, time) {
    const twinkle = 0.5 + 0.5 * Math.sin(time * this.twinkleSpeed + this.twinklePhase);
    const alpha = this.life * (this.type === 'star' ? twinkle : 0.3 + twinkle * 0.2);

    if (this.type === 'nebula') {
      const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 6);
      gradient.addColorStop(0, starColor(this.seed, alpha * 0.6));
      gradient.addColorStop(0.4, starColor(this.seed + 20, alpha * 0.2));
      gradient.addColorStop(1, 'transparent');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius * 6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Glow
      const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 4);
      gradient.addColorStop(0, starColor(this.seed, alpha));
      gradient.addColorStop(0.1, starColor(this.seed, alpha * 0.6));
      gradient.addColorStop(0.4, starColor(this.seed, alpha * 0.1));
      gradient.addColorStop(1, 'transparent');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);
      ctx.fill();

      // Core
      ctx.fillStyle = `rgba(255,255,255,${alpha * 0.9})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// --- Constellations ---
function drawConstellations(ctx) {
  const stars = particles.filter(p => p.type === 'star' && p.life > 0.5);
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < stars.length; i++) {
    for (let j = i + 1; j < stars.length; j++) {
      const dx = stars[i].x - stars[j].x;
      const dy = stars[i].y - stars[j].y;
      const dist = dx * dx + dy * dy;
      if (dist < 8000) {
        const alpha = (1 - dist / 8000) * 0.08 * stars[i].life * stars[j].life;
        ctx.strokeStyle = `rgba(200,220,255,${alpha})`;
        ctx.beginPath();
        ctx.moveTo(stars[i].x, stars[i].y);
        ctx.lineTo(stars[j].x, stars[j].y);
        ctx.stroke();
      }
    }
  }
}

// --- Background stars ---
const bgStars = Array.from({ length: 200 }, () => ({
  x: Math.random() * 3000,
  y: Math.random() * 2000,
  r: Math.random() * 1.2,
  twinkle: Math.random() * 0.03,
  phase: Math.random() * Math.PI * 2
}));

function drawBackground(time) {
  ctx.fillStyle = 'rgba(2, 2, 12, 1)';
  ctx.fillRect(0, 0, W, H);

  for (const s of bgStars) {
    const alpha = 0.2 + 0.3 * Math.sin(time * s.twinkle + s.phase);
    ctx.fillStyle = `rgba(180,190,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Shooting stars ---
const shootingStars = [];
function maybeSpawnShootingStar() {
  if (Math.random() < 0.003 && shootingStars.length < 3) {
    shootingStars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.4,
      vx: 4 + Math.random() * 6,
      vy: 2 + Math.random() * 3,
      life: 1,
      trail: []
    });
  }
}

function updateShootingStars() {
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.trail.push({ x: s.x, y: s.y });
    if (s.trail.length > 20) s.trail.shift();
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 0.015;
    if (s.life <= 0) shootingStars.splice(i, 1);
  }
}

function drawShootingStars() {
  for (const s of shootingStars) {
    for (let i = 0; i < s.trail.length; i++) {
      const alpha = (i / s.trail.length) * s.life * 0.6;
      const r = (1 - i / s.trail.length) * 2;
      ctx.fillStyle = `rgba(255,255,240,${alpha})`;
      ctx.beginPath();
      ctx.arc(s.trail[i].x, s.trail[i].y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// --- Mouse ---
const mouse = { x: W / 2, y: H / 2, active: false, down: false, holdTime: 0 };
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('mousedown', e => {
  mouse.down = true;
  mouse.active = true;
  mouse.holdTime = 0;
  // Burst of stars on click
  for (let i = 0; i < 8 + Math.random() * 12; i++) {
    if (particles.length < MAX_PARTICLES) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 40;
      particles.push(new Particle(
        e.clientX + Math.cos(angle) * dist,
        e.clientY + Math.sin(angle) * dist,
        'star'
      ));
    }
  }
});
addEventListener('mouseup', () => { mouse.down = false; mouse.active = false; mouse.holdTime = 0; });
addEventListener('wheel', e => { hueShift = (hueShift + e.deltaY * 0.3) % 360; });

// Touch support
addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
  mouse.down = true; mouse.active = true; mouse.holdTime = 0;
  for (let i = 0; i < 10; i++) {
    if (particles.length < MAX_PARTICLES) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 40;
      particles.push(new Particle(t.clientX + Math.cos(angle) * dist, t.clientY + Math.sin(angle) * dist, 'star'));
    }
  }
}, { passive: false });
addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
}, { passive: false });
addEventListener('touchend', () => { mouse.down = false; mouse.active = false; mouse.holdTime = 0; });

// --- Seed the universe ---
for (let i = 0; i < 50; i++) {
  particles.push(new Particle(
    W * 0.3 + Math.random() * W * 0.4,
    H * 0.3 + Math.random() * H * 0.4,
    Math.random() < 0.3 ? 'nebula' : 'star'
  ));
}

// --- Main loop ---
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time++;

  // Hold to spawn nebula
  if (mouse.down) {
    mouse.holdTime++;
    if (mouse.holdTime > 20 && mouse.holdTime % 3 === 0 && particles.length < MAX_PARTICLES) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 20;
      particles.push(new Particle(
        mouse.x + Math.cos(angle) * dist,
        mouse.y + Math.sin(angle) * dist,
        'nebula'
      ));
    }
  }

  drawBackground(time);

  // Composite mode for glow
  ctx.globalCompositeOperation = 'lighter';

  drawConstellations(ctx);

  for (let i = particles.length - 1; i >= 0; i--) {
    if (!particles[i].update(mouse)) {
      particles.splice(i, 1);
    } else {
      particles[i].draw(ctx, time);
    }
  }

  maybeSpawnShootingStar();
  updateShootingStars();
  drawShootingStars();

  ctx.globalCompositeOperation = 'source-over';
}

animate();
</script>
</body>
</html>
